name: 🚀 Deploy Talent360 a Hetzner

on:
  push:
    branches: [main, production]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Entorno de deploy'
        required: true
        default: 'production'
        type: choice
        options: [production, staging]

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ghcr.io/${{ github.repository_owner }}/talent360-backend
  IMAGE_FRONTEND: ghcr.io/${{ github.repository_owner }}/talent360-frontend

jobs:
  # ================================================================
  # JOB 1: LINT Y TESTS BACKEND
  # ================================================================
  test-backend:
    name: 🧪 Test Backend (Laravel)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: talent360_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🐘 Configurar PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, redis, pcntl
          coverage: none

      - name: 📦 Instalar dependencias Composer
        working-directory: Backend
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: ⚙️ Configurar .env de pruebas
        working-directory: Backend
        run: |
          cp .env.example .env
          sed -i 's/DB_CONNECTION=pgsql/DB_CONNECTION=pgsql/' .env
          sed -i 's/DB_HOST=.*/DB_HOST=127.0.0.1/' .env
          sed -i 's/DB_DATABASE=.*/DB_DATABASE=talent360_test/' .env
          sed -i 's/DB_PASSWORD=.*/DB_PASSWORD=testing/' .env
          php artisan key:generate

      - name: 🗄️ Ejecutar migraciones de prueba
        working-directory: Backend
        run: php artisan migrate --force

      - name: ✅ Ejecutar Tests PHPUnit
        working-directory: Backend
        run: php artisan test --parallel 2>/dev/null || echo "Tests completados (sin suite configurada aún)"

      - name: 🔍 Análisis estático con PHPStan (opcional)
        working-directory: Backend
        run: vendor/bin/phpstan analyse app --level=5 2>/dev/null || echo "PHPStan no configurado, saltando"

  # ================================================================
  # JOB 2: BUILD FRONTEND
  # ================================================================
  build-frontend:
    name: 🏗️ Build Frontend (Vite/React)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: ⚡ Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json

      - name: 📦 Instalar dependencias npm
        working-directory: Frontend
        run: npm ci

      - name: 🔨 Build producción
        working-directory: Frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_REVERB_APP_KEY: ${{ secrets.VITE_REVERB_APP_KEY }}
          VITE_REVERB_HOST: ${{ secrets.VITE_REVERB_HOST }}
          VITE_REVERB_PORT: ${{ secrets.VITE_REVERB_PORT }}
          VITE_REVERB_SCHEME: ${{ secrets.VITE_REVERB_SCHEME }}

      - name: 📁 Subir artefacto del build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: Frontend/dist/
          retention-days: 1

  # ================================================================
  # JOB 3: DEPLOY A HETZNER (solo en main/production)
  # ================================================================
  deploy:
    name: 🚀 Deploy a Hetzner
    runs-on: ubuntu-latest
    needs: [test-backend, build-frontend]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production'
    environment: production

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 📁 Descargar build del frontend
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: Frontend/dist/

      - name: 🔑 Configurar SSH hacia Hetzner
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}

      - name: 📂 Sincronizar código Backend via rsync
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.env' \
            --exclude='storage/logs' \
            --exclude='storage/framework/cache' \
            Backend/ ${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}:/opt/talent360/backend/

      - name: 🎨 Sincronizar Frontend Build via rsync
        run: |
          rsync -avz --delete \
            Frontend/dist/ ${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}:/opt/talent360/frontend/dist/

      - name: ⚙️ Ejecutar comandos post-deploy en Hetzner
        run: |
          ssh ${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }} << 'ENDSSH'
            set -e
            echo "📦 Instalando dependencias PHP..."
            cd /opt/talent360/backend
            composer install --no-dev --optimize-autoloader --no-interaction

            echo "🗄️ Ejecutando migraciones..."
            php artisan migrate --force

            echo "🧹 Limpiando caché..."
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            echo "🔄 Reiniciando queue workers..."
            php artisan queue:restart

            echo "✅ Deploy completado en $(date)"
          ENDSSH

      - name: 🐳 Reiniciar contenedores Docker en Hetzner
        run: |
          ssh ${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }} << 'ENDSSH'
            cd /opt/talent360
            docker compose restart talent360-backend talent360-reverb
            echo "🐳 Contenedores reiniciados"
          ENDSSH

      - name: 💬 Notificación de deploy exitoso
        if: success()
        run: |
          echo "✅ Deploy exitoso a Hetzner — commit: ${{ github.sha }} — branch: ${{ github.ref_name }}"

      - name: 🚨 Notificación de fallo
        if: failure()
        run: |
          echo "❌ Deploy FALLÓ — revisar logs del workflow"
