server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # El service worker, su registrador, el manifiesto y el index.html NUNCA se cachean.
    #
    # Estaban bajo la regla de abajo (30 días para todo .js): el navegador se quedaba con el
    # sw.js viejo, que a su vez servía el index.html y el paquete viejos desde su precache, y
    # cada despliegue era invisible para quien ya había entrado — el dueño veía "no agregaste
    # la X" con la X ya desplegada, y mi propio navegador ejecutaba index-DBUcYIJp.js mientras
    # el servidor servía index-Czf1VXbH.js. Los assets con hash en el nombre sí pueden vivir
    # 30 días: si cambian, cambia el nombre.
    location = /sw.js            { add_header Cache-Control "no-cache, no-store, must-revalidate"; expires -1; }
    location = /registerSW.js    { add_header Cache-Control "no-cache, no-store, must-revalidate"; expires -1; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache, no-store, must-revalidate"; expires -1; }
    location = /index.html       { add_header Cache-Control "no-cache, no-store, must-revalidate"; expires -1; }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location /api {
        proxy_pass http://backend-web;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /broadcasting {
        proxy_pass http://backend-web;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Caché larga SOLO para los assets con hash en el nombre (/assets/index-Czf1VXbH.js):
    # si su contenido cambia, cambia su nombre, así que nunca se sirve uno viejo.
    location ^~ /assets/ {
        expires 30d;
        add_header Cache-Control "public, no-transform, immutable";
    }

    # Imágenes y demás estáticos sin hash: caché corta, para que un logo nuevo se vea en el día.
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff2)$ {
        expires 1d;
        add_header Cache-Control "public, no-transform";
    }
}
