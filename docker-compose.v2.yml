services:
  db:
    image: postgres:16-alpine
    container_name: talent360_v2_postgres
    env_file:
      - ./Backend/.env
    ports:
      # PostgreSQL sólo se publica para diagnóstico desde el propio servidor. Los contenedores
      # de la aplicación entran por la red interna `talent360_v2_network`.
      - "127.0.0.1:5434:5432"
    volumes:
      - pgdata_v2:/var/lib/postgresql/data
    networks:
      - talent360_v2_network
    restart: unless-stopped

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: talent360-v2-backend
    restart: unless-stopped
    working_dir: /var/www
    # Laravel lee estas credenciales desde Backend/.env. No se fuerzan aquí: hacerlo anulaba
    # DB_USERNAME/DB_PASSWORD y mantenía a la aplicación conectada como superusuario.
    depends_on:
      - db
    volumes:
      - ./Backend:/var/www
      - /etc/talent360-v2/apple-signin.p8:/run/secrets/apple-signin.p8:ro
    networks:
      - talent360_v2_network

  backend-web:
    image: nginx:alpine
    container_name: talent360-v2-backend-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8002:80"
    volumes:
      - ./Backend:/var/www
      - ./nginx-backend.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - talent360_v2_network

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        # Reverb de la V2 sale por el 8082 del host, accesible sólo por el proxy local.
        VITE_REVERB_PORT: "8082"
    container_name: talent360-v2-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:80"
    environment:
      - VITE_API_URL=http://localhost:8002/api
    depends_on:
      - backend-web
    networks:
      - talent360_v2_network

  reverb:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: talent360-v2-reverb
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:8080"
    working_dir: /var/www
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    volumes:
      - ./Backend:/var/www
      - /etc/talent360-v2/apple-signin.p8:/run/secrets/apple-signin.p8:ro
    environment:
      - BROADCAST_CONNECTION=reverb
    depends_on:
      - db
    networks:
      - talent360_v2_network

networks:
  talent360_v2_network:
    driver: bridge

volumes:
  pgdata_v2:
