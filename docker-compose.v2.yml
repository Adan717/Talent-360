version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: talent360_v2_postgres
    environment:
      POSTGRES_DB: talent360_v2_saas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Master
    ports:
      - "5434:5432"
    volumes:
      - pgdata_v2:/var/lib/postgresql/data
    networks:
      - talent360_v2_network
    restart: unless-stopped

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: talent360-v2-backend
    restart: unless-stopped
    working_dir: /var/www
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=talent360_v2_saas
      - DB_USERNAME=postgres
      - DB_PASSWORD=Master
    depends_on:
      - db
    volumes:
      - ./Backend:/var/www
    networks:
      - talent360_v2_network

  backend-web:
    image: nginx:alpine
    container_name: talent360-v2-backend-web
    restart: unless-stopped
    ports:
      - "8002:80"
    volumes:
      - ./Backend:/var/www
      - ./nginx-backend.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - talent360_v2_network

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        # Reverb de la V2 sale por el 8082 del host (abajo: "8082:8080").
        VITE_REVERB_PORT: "8082"
    container_name: talent360-v2-frontend
    restart: unless-stopped
    ports:
      - "3002:80"
    environment:
      - VITE_API_URL=http://localhost:8002/api
    depends_on:
      - backend-web
    networks:
      - talent360_v2_network

  reverb:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: talent360-v2-reverb
    restart: unless-stopped
    ports:
      - "8082:8080"
    working_dir: /var/www
    command: php artisan reverb:start --host=0.0.0.0 --port=8080 --debug
    volumes:
      - ./Backend:/var/www
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=talent360_v2_saas
      - DB_USERNAME=postgres
      - DB_PASSWORD=Master
      - BROADCAST_CONNECTION=reverb
    depends_on:
      - db
    networks:
      - talent360_v2_network

networks:
  talent360_v2_network:
    driver: bridge

volumes:
  pgdata_v2:
